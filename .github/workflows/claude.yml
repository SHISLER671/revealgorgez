name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == 'SHISLER671' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude-go')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude-go')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude-go')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude-go') || contains(github.event.issue.title, '@claude-go')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude-go"
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 10
            --allowedTools "Bash(npm ci),Bash(npm install),Bash(npm run build),Bash(npm run lint)"
